name: Football Pace Shadow

# Shadow CFB drive sim — data/shadow/football_pace/ only (no docs site, no live picks).

on:
  schedule:
    # Tuesday 14:00 UTC (~10 AM ET) — weekly slate + injury snapshot
    - cron: "0 14 * * 2"
    # Thu / Sat / Sun mornings UTC (pregame injury refresh)
    - cron: "0 14 * * 4"
    - cron: "0 14 * * 6"
    - cron: "0 13 * * 0"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: football-pace-shadow
  cancel-in-progress: false

jobs:
  football-pace-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: CFB drive Monte Carlo weekly slate
        run: python scripts/run_cfb_drive_sim.py --season 2026 --sims 10000

      - name: Commit shadow artifacts
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/shadow/football_pace/
          if git diff --staged --quiet; then
            echo "No football pace shadow changes"
          else
            git commit -m "chore(shadow): CFB drive sim weekly slate"
            git pull --rebase --autostash origin main
            git push
          fi
