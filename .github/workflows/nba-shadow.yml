name: NBA Shadow (private)

# Paper-trading scan — data/shadow/ plus docs/nba.html (testing page only; no football docs).
#
# Schedule (America/New_York):
#   Mon–Fri primary 1:07 PM ET, backup 4:07 PM ET
#   Sat–Sun primary 9:07 AM ET, backup 11:07 AM ET
# Two UTC crons per slot (EDT vs EST); check_nba_shadow_schedule.py keeps the seasonal line only.
# Off-the-hour minutes (:07) because GitHub drops / delays top-of-hour schedules the most.
# Late GitHub starts are allowed until shortly before the first tip-off of the ET day.
# Backup runs skip when today's primary scan already succeeded (cheap fallback).

on:
  schedule:
    # Weekday 1:07 PM ET — 17:07 UTC (EDT) and 18:07 UTC (EST)
    - cron: "7 17 * * 1-5"
    - cron: "7 18 * * 1-5"
    # Weekday 4:07 PM ET backup — 20:07 UTC (EDT) and 21:07 UTC (EST)
    - cron: "7 20 * * 1-5"
    - cron: "7 21 * * 1-5"
    # Weekend 9:07 AM ET — 13:07 UTC (EDT) and 14:07 UTC (EST)
    - cron: "7 13 * * 0,6"
    - cron: "7 14 * * 0,6"
    # Weekend 11:07 AM ET backup — 15:07 UTC (EDT) and 16:07 UTC (EST)
    - cron: "7 15 * * 0,6"
    - cron: "7 16 * * 0,6"
  workflow_dispatch:
    inputs:
      demo:
        description: "Use offline demo fixture (no Odds API)"
        type: boolean
        default: false
      game_lines_only:
        description: "Game lines only (skip player props — saves ~48 Odds API credits)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nba-shadow
  cancel-in-progress: false

jobs:
  nba-shadow:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.ran_flag.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      # Install before the gate: the backup-slot check imports sharp_scout.nba.score_model
      # (numpy), which crashed with ModuleNotFoundError when the gate ran first.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Gate — scheduled ET window
        id: gate
        if: github.event_name == 'schedule'
        env:
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python scripts/check_nba_shadow_schedule.py

      - id: ran_flag
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.gate.outputs.run }}" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure env
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV

      - name: Settle NBA paper ledger
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: python scripts/settle_nba.py || echo 'NBA settle failed (non-fatal)'

      - name: Run NBA shadow pipeline
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          # Player props scans disabled site-wide (NBA_PROPS_SCAN_ENABLED=false); game lines only.
          EXTRA="--no-props"
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then
            python scripts/run_nba_shadow.py --demo $EXTRA
          else
            python scripts/run_nba_shadow.py $EXTRA
          fi

      - name: Build NBA public page
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: python -c "from sharp_scout.site.nba_page import build_nba_page; build_nba_page()"

      - name: Commit shadow artifacts and NBA page
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_add_paths.sh
          scripts/ci_git_add_paths.sh \
            data/shadow/ \
            data/paper/nba_score_model.json \
            data/paper/nba_score_model_priors.json \
            data/paper/nba_score_model_state.json \
            data/paper/nba_injury_lag.json \
            data/paper/nba_pace_of_play_official.json \
            data/paper/nba_pace_of_play_official.csv \
            data/paper/nba_totals_current_season_shadow.json \
            data/paper/nba_totals_current_season_shadow.csv \
            docs/nba.html \
            docs/nba_latest_signals.json \
            docs/nba_ledger.json \
            docs/nba_paper_report.json \
            docs/nba_score_model.json \
            docs/nba_injury_lag.json \
            docs/nba_pace_of_play_official.json \
            docs/nba_pace_of_play_official.csv
          if git diff --staged --quiet; then
            echo "No shadow changes"
          else
            chmod +x scripts/ci_git_push_retry.sh
            export ADD_PATHS="data/shadow/ data/paper/nba_score_model.json data/paper/nba_score_model_priors.json data/paper/nba_score_model_state.json data/paper/nba_injury_lag.json data/paper/nba_pace_of_play_official.json data/paper/nba_pace_of_play_official.csv data/paper/nba_totals_current_season_shadow.json data/paper/nba_totals_current_season_shadow.csv docs/nba.html docs/nba_latest_signals.json docs/nba_ledger.json docs/nba_paper_report.json docs/nba_score_model.json docs/nba_injury_lag.json docs/nba_pace_of_play_official.json docs/nba_pace_of_play_official.csv"
            ./scripts/ci_git_push_retry.sh "chore(nba): shadow paper-trading scan"
          fi

      - name: Build unlisted NCAAM page (not committed, not linked)
        if: always()
        env:
          NCAAM_LAB_SLUG: ${{ secrets.NCAAM_LAB_SLUG }}
        run: python3 scripts/build_ncaam_lab.py || true

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy-pages:
    needs: nba-shadow
    if: github.ref == 'refs/heads/main' && needs.nba-shadow.outputs.ran == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
