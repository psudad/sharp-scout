name: NCAAF Line Snapshots (CLV)

# Schedule-driven sharp line capture + gameday board refresh for college football:
#   • Tuesday ~10:07 ET — rebuild plan + opening lines for the college week
#   • :07 / :23 / :41 UTC gate — only calls the Odds API when a game is at T-6h / T-4h / T-3h / T-1h
#   • T-3h / T-1h — full board rebuild (plays, splits, open→now, When-to-bet) → docs/
#     and an in-workflow GitHub Pages deploy (pushes from the Actions token don't
#     trigger the separate pages.yml, so this workflow deploys itself).
#
# Requires repo secret: ODDS_API_KEY (ACTION_NETWORK_TOKEN optional for money %)
#
# Scheduled Odds API usage gated by scripts/check_odds_credit_pause.py (workflow_dispatch always runs).

on:
  schedule:
    # Tuesday 14:07 UTC (~10:07 ET) — weekly opening lines + refresh plan
    - cron: "7 14 * * 2"
    # Off-minute times (GitHub schedule is best-effort, often 3–5h apart). Gate uses
    # REBUILD_LEAD_HOURS so every game still gets a pregame refresh when a fire lands.
    - cron: "7,23,41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force snapshot now (ignore plan gate)"
        type: boolean
        default: false
      rebuild_plan:
        description: "Rebuild ncaaf_line_plan.json before snapshot"
        type: boolean
        default: false
      rebuild_report:
        description: "Force a full board rebuild now (plays, splits, When-to-bet)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-scout-main-commits
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deployflag.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate — odds credit pause (scheduled)
        id: credit
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 scripts/check_odds_credit_pause.py --workflow ncaaf-lines

      - uses: actions/setup-python@v5
        if: steps.credit.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.credit.outputs.proceed == 'true'
        run: pip install -e .

      # Cache cfbfastR play-by-play parquet so the gameday rebuild builds REAL power
      # ratings without re-downloading ~400MB every run. Keyed by month so a new
      # season's data is refetched when it lands.
      - name: Cache CFB play-by-play
        if: steps.credit.outputs.proceed == 'true'
        uses: actions/cache@v4
        with:
          path: data/cfb_pbp_cache
          key: cfb-pbp-${{ github.run_id }}
          restore-keys: |
            cfb-pbp-

      - name: Configure env
        if: steps.credit.outputs.proceed == 'true'
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV
          echo "GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> $GITHUB_ENV

      - name: Settle finished CFB games (T+3h after kickoff)
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        id: settle
        continue-on-error: true
        run: |
          HASH_BEFORE=$(sha256sum data/ncaaf_ledger.json 2>/dev/null | cut -d' ' -f1 || echo none)
          python scripts/settle_plays.py --sport ncaaf --build-site
          HASH_AFTER=$(sha256sum data/ncaaf_ledger.json | cut -d' ' -f1)
          if [ "$HASH_BEFORE" != "$HASH_AFTER" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tuesday — rebuild plan and capture opening lines
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          (github.event.schedule == '7 14 * * 2' ||
          (github.event_name == 'workflow_dispatch' && inputs.rebuild_plan))
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY — skipping"
            exit 0
          fi
          python scripts/plan_ncaaf_snapshots.py
          python scripts/record_line_snapshots.py --sport ncaaf --week-only

      - name: Gate — skip hour if no snapshot window due
        id: gate
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          github.event_name == 'schedule' &&
          github.event.schedule != '7 14 * * 2'
        run: python scripts/check_ncaaf_snapshot_plan.py

      - name: Run due pre-kick line snapshots
        # Snapshot-only when a window is due but no full rebuild is (T-6h / T-4h).
        # At T-3h / T-1h the full pipeline below records snapshots itself.
        if: |
          steps.credit.outputs.proceed == 'true' && (
          (github.event_name == 'workflow_dispatch' && inputs.force && !inputs.rebuild_report) ||
          (steps.gate.outputs.run == 'true' && steps.gate.outputs.rebuild != 'true'))
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY — skipping"
            exit 0
          fi
          python scripts/record_line_snapshots.py --sport ncaaf --week-only

      - name: Settle prior NCAAF plays (gameday rebuild)
        if: |
          steps.credit.outputs.proceed == 'true' && (
          (github.event_name == 'workflow_dispatch' && inputs.rebuild_report) ||
          (steps.gate.outputs.rebuild == 'true'))
        continue-on-error: true
        run: python scripts/settle_plays.py --sport ncaaf --build-site

      - name: Gameday full board rebuild (T-3h / T-1h)
        # Refreshes the public report — plays, splits, open→now, When-to-bet — before kickoff.
        if: |
          steps.credit.outputs.proceed == 'true' && (
          (github.event_name == 'workflow_dispatch' && inputs.rebuild_report) ||
          (steps.gate.outputs.rebuild == 'true'))
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY — skipping rebuild"
            exit 0
          fi
          # Pipeline auto-determines current CFB week if not specified
          python scripts/run_ncaaf.py --build-site
          # Stamp the rebuild so the gate can throttle the next runs.
          printf '{"last_rebuild": "%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" > data/ncaaf_rebuild_state.json

      - name: Flag whether a Pages deploy is needed
        id: deployflag
        if: steps.credit.outputs.proceed == 'true'
        run: |
          if [ "${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_report }}" = "true" ] || [ "${{ steps.gate.outputs.rebuild }}" = "true" ] || [ "${{ steps.settle.outputs.changed }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit plan + line history + site
        if: steps.credit.outputs.proceed == 'true'
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_push_retry.sh scripts/ci_git_add_paths.sh
          export ADD_PATHS="data/ncaaf_line_plan.json data/line_history.json data/line_history_archive.json data/open_lines.json data/ncaaf_ledger.json data/ncaaf_rebuild_state.json data/shadow/ reports/ncaaf_totals_high_ev.md docs/"
          ./scripts/ci_git_push_retry.sh "chore: NCAAF line snapshots + gameday board refresh (scheduled)" bash -c "python scripts/run_ncaaf.py --build-site"

      - name: Upload Pages artifact
        if: steps.deployflag.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: snapshot
    if: needs.snapshot.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
