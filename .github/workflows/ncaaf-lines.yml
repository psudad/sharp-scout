name: NCAAF Line Snapshots (CLV)

# Hourly sharp-book line capture for college football — feeds closing-line value
# at settlement without re-running the full ratings pipeline.
# Requires repo secret: ODDS_API_KEY

on:
  schedule:
    # Wed–Sat hourly — weeknight games + Saturday slates
    - cron: "0 * * * 3-6"
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo mode (mock odds)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ncaaf-lines
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV

      - name: Record NCAAF sharp lines
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
        run: |
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            echo "Skipping live snapshot (demo or missing ODDS_API_KEY)"
            exit 0
          fi
          python scripts/record_line_snapshots.py --sport ncaaf

      - name: Commit line history
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/line_history.json
          if git diff --staged --quiet; then
            echo "No line history changes"
          else
            git commit -m "chore: NCAAF line snapshots for CLV"
            git push
          fi
