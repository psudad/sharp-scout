name: NCAAF Pipeline + Ledger

# Runs the college football signal pipeline, settles completed games, rebuilds docs/.
# Requires repo secrets: ODDS_API_KEY (required), ACTION_NETWORK_TOKEN (optional splits).

on:
  schedule:
    # Primary ~11:07 AM ET (15:07 UTC EDT) Mon–Sat + earlier backups if GitHub cron drifts
    - cron: "7 15 * * 1-6"
    - cron: "41 14 * * 1-6"   # ~10:41 AM ET backup
    - cron: "23 13 * * 1-6"   # ~9:23 AM ET backup
    # Saturday ~2:23 PM ET (18:23 UTC) + backups before the 3:30 kickoff wave
    - cron: "23 18 * * 6"
    - cron: "7 17 * * 6"      # ~1:07 PM ET backup
    - cron: "41 17 * * 6"     # ~1:41 PM ET backup
    # Friday/Saturday ~6:07 PM ET (22:07 UTC) + earlier backups
    - cron: "7 22 * * 5,6"
    - cron: "41 21 * * 5,6"   # ~5:41 PM ET backup
    - cron: "23 20 * * 5,6"   # ~4:23 PM ET backup
    # Sunday ~8:07 AM ET — settle Saturday night
    - cron: "7 12 * * 0"
    - cron: "41 11 * * 0"     # ~7:41 AM ET backup
  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode (no API keys)"
        type: boolean
        default: false
      skip_pbp:
        description: "Skip cfbfastR PBP download"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-scout-main-commits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV
          echo "GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> $GITHUB_ENV

      - name: Settle prior NCAAF plays
        continue-on-error: true
        run: python scripts/settle_plays.py --sport ncaaf

      - name: College-week line plan + opening snapshots
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then exit 0; fi
          python scripts/plan_ncaaf_snapshots.py
          python scripts/record_line_snapshots.py --sport ncaaf --week-only

      - name: Run NCAAF pipeline
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          SKIP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pbp || false }}
        run: |
          ARGS="--build-site"
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
            echo "Running NCAAF in demo mode (no ODDS_API_KEY or demo requested)"
          elif [ "$SKIP_INPUT" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          python scripts/run_ncaaf.py $ARGS

      - name: Refresh NCAAF line snapshot plan
        continue-on-error: true
        run: python scripts/plan_ncaaf_snapshots.py

      - name: Commit ledger + site
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_push_retry.sh scripts/ci_git_add_paths.sh
          export ADD_PATHS="data/ncaaf_ledger.json data/ncaaf_line_plan.json data/line_history.json data/open_lines.json data/shadow/ reports/ncaaf_totals_high_ev.md docs/"
          ./scripts/ci_git_push_retry.sh "chore: update NCAAF ledger and GitHub Pages site" bash -c "python scripts/run_ncaaf.py --build-site"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
