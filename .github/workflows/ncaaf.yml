name: NCAAF Pipeline + Ledger

# Runs the college football signal pipeline, settles completed games, rebuilds docs/.
# Requires repo secrets: ODDS_API_KEY (required), ACTION_NETWORK_COOKIE (optional).

on:
  schedule:
    # Tuesday–Saturday 15:00 UTC — midweek slate + Thu–Sat kickoffs
    - cron: "0 15 * * 2-6"
    # Sunday 12:00 UTC — settle Saturday night
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode (no API keys)"
        type: boolean
        default: false
      skip_pbp:
        description: "Skip cfbfastR PBP download"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ncaaf-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV

      - name: Settle prior NCAAF plays
        continue-on-error: true
        run: python scripts/settle_plays.py --sport ncaaf

      - name: Run NCAAF pipeline
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          SKIP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pbp || false }}
        run: |
          ARGS="--build-site"
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
            echo "Running NCAAF in demo mode (no ODDS_API_KEY or demo requested)"
          elif [ "$SKIP_INPUT" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          python scripts/run_ncaaf.py $ARGS

      - name: Commit ledger + site
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf_ledger.json docs/
          if git diff --staged --quiet; then
            echo "No NCAAF ledger/site changes"
          else
            git commit -m "chore: update NCAAF ledger and GitHub Pages site"
            git push
          fi
