name: NCAAF Pipeline + Ledger

# Runs the college football signal pipeline, settles completed games, rebuilds docs/.
# Requires repo secrets: ODDS_API_KEY (required), ACTION_NETWORK_TOKEN (optional splits).
#
# Primary slots always run; +25 / +50 min backups run only when last_rebuild is still stale
# (see scripts/check_ncaaf_pipeline_schedule.py).

on:
  schedule:
    # Mon–Sat ~11:07 AM ET primary + backups at +25 / +50 min
    - cron: "7 15 * * 1-6"
    - cron: "32 15 * * 1-6"
    - cron: "57 15 * * 1-6"
    # Saturday ~2:23 PM ET + backups
    - cron: "23 18 * * 6"
    - cron: "48 18 * * 6"
    - cron: "13 19 * * 6"
    # Friday/Saturday ~6:07 PM ET + backups
    - cron: "7 22 * * 5,6"
    - cron: "32 22 * * 5,6"
    - cron: "57 22 * * 5,6"
    # Sunday ~8:07 AM ET settle + backups
    - cron: "7 12 * * 0"
    - cron: "32 12 * * 0"
    - cron: "57 12 * * 0"
  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode (no API keys)"
        type: boolean
        default: false
      skip_pbp:
        description: "Skip cfbfastR PBP download (uses placeholder ratings; will NOT publish NCAAF plays to docs/ or append ledger locks)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ncaaf-full-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.ran_flag.outputs.ran }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate — primary vs conditional backup slot
        id: slot
        if: github.event_name == 'schedule'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 scripts/check_ncaaf_pipeline_schedule.py

      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        run: pip install -e .

      - name: Configure env
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV
          echo "GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> $GITHUB_ENV

      - name: Settle prior NCAAF plays
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/settle_plays.py --sport ncaaf

      - name: College-week line plan + opening snapshots
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        continue-on-error: true
        run: |
          if [ -z "$ODDS_API_KEY" ]; then exit 0; fi
          python scripts/plan_ncaaf_snapshots.py
          python scripts/record_line_snapshots.py --sport ncaaf --week-only

      - name: Run NCAAF pipeline
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          SKIP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pbp || false }}
        run: |
          ARGS="--build-site"
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
            echo "Running NCAAF in demo mode (no ODDS_API_KEY or demo requested)"
          elif [ "$SKIP_INPUT" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          set +e
          python scripts/run_ncaaf.py $ARGS
          RC=$?
          set -e
          chmod +x scripts/ncaaf_ci_post_run.sh
          scripts/ncaaf_ci_post_run.sh "$RC"

      - name: Refresh NCAAF line snapshot plan
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/plan_ncaaf_snapshots.py

      - name: Assert NCAAF docs match pipeline artifact
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        run: python scripts/assert_ncaaf_docs_synced.py

      - name: Commit ledger + site
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_push_retry.sh scripts/ci_git_add_paths.sh
          export ADD_PATHS="data/ncaaf_ledger.json data/ncaaf_line_plan.json data/line_history.json data/open_lines.json data/ncaaf_rebuild_state.json data/shadow/ reports/ncaaf_totals_high_ev.md docs/"
          chmod +x scripts/ncaaf_ci_run_and_post.sh scripts/ncaaf_ci_post_run.sh
          ./scripts/ci_git_push_retry.sh "chore: update NCAAF ledger and GitHub Pages site" bash -c "scripts/ncaaf_ci_run_and_post.sh --build-site"

      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' || steps.slot.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: ran_flag
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ steps.slot.outputs.run }}" = "true" ]; then
            echo "ran=true" >> "$GITHUB_OUTPUT"
          else
            echo "ran=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main' && needs.run.outputs.ran == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
