name: NCAAM picks (lock + publish)

# Looping runner for College Basketball locks + GitHub Pages deploy.
# Requires ODDS_API_KEY (NCAAM budget capped at 120 credits/day in code).

on:
  schedule:
    - cron: "5 14 * * *"
    - cron: "5 15 * * *"
    - cron: "5 16 * * *"
    - cron: "35 17 * * *"
    - cron: "5 19 * * *"
    - cron: "5 21 * * *"
    - cron: "5 23 * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Offline demo pass (no API keys)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ncaam
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Runner (loop until slate done / budget)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          if [ "${{ github.event.inputs.demo }}" = "true" ]; then
            python scripts/run_ncaam.py --demo --once
            exit 0
          fi
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY; skipping live NCAAM run"
            exit 0
          fi
          python scripts/run_ncaam.py --loop --budget-min 340 --pass-every-min 15

      - name: Commit NCAAM artifacts
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaam/ data/ncaam_ledger.json data/ncaam_latest_signals.json docs/ncaam.html docs/ncaam_ledger.json docs/ncaam_record.json
          if git diff --staged --quiet; then
            echo "No NCAAM changes"
          else
            chmod +x scripts/ci_git_push_retry.sh
            export ADD_PATHS="data/ncaam/ data/ncaam_ledger.json data/ncaam_latest_signals.json docs/ncaam.html docs/ncaam_ledger.json docs/ncaam_record.json"
            ./scripts/ci_git_push_retry.sh "chore(ncaam): lock picks + board"
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
