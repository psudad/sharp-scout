name: NFL Pipeline + Ledger

# Runs the signal pipeline, settles completed games, rebuilds docs/, commits results.
# Requires repo secrets: ODDS_API_KEY (required), ACTION_NETWORK_COOKIE (optional).

on:
  schedule:
    # Monday–Saturday 15:00 UTC (~11 AM ET) — daily slate + opening lines through the week
    - cron: "0 15 * * 1-6"
    # Sunday 15:00 UTC (~11 AM ET) — game-day morning refresh
    - cron: "0 15 * * 0"
    # Sunday 18:30 UTC (~2:30 PM ET) — afternoon refresh before the 4 PM wave
    - cron: "30 18 * * 0"
    # Sunday + Thursday 22:00 UTC — late refresh (SNF / TNF windows)
    - cron: "0 22 * * 0,4"
    # Monday 16:00 UTC (~12 PM ET) — MNF day refresh
    - cron: "0 16 * * 1"
  workflow_dispatch:
    inputs:
      demo:
        description: "Run in demo mode (no API keys)"
        type: boolean
        default: false
      skip_pbp:
        description: "Skip nflverse PBP download"
        type: boolean
        default: false
      today_slate:
        description: "Today's NFL games only (Eastern kickoff day)"
        type: boolean
        default: false
      fresh_ledger:
        description: "Clear ledger before run (today slate)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV

      - name: Settle prior NFL plays
        continue-on-error: true
        run: python scripts/settle_plays.py

      - name: Refit probability calibration
        # Self-updates data/calibration.json from settled history. No-op / identity
        # until enough plays have graded; safe to run every pipeline execution.
        continue-on-error: true
        run: python scripts/fit_calibration.py

      - name: Run pipeline
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          SKIP_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_pbp || false }}
          TODAY_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.today_slate || false }}
          FRESH_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.fresh_ledger || false }}
        run: |
          if [ "$TODAY_INPUT" = "true" ]; then
            ARGS="--build-site"
            if [ "$FRESH_INPUT" = "true" ]; then ARGS="$ARGS --fresh-ledger"; fi
            if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
              ARGS="$ARGS --demo --skip-pbp"
            elif [ "$SKIP_INPUT" = "true" ]; then
              ARGS="$ARGS --skip-pbp"
            fi
            python scripts/run_today_slate.py $ARGS
            exit 0
          fi
          ARGS="--build-site"
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
            echo "Running in demo mode (no ODDS_API_KEY or demo requested)"
          elif [ "$SKIP_INPUT" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          python scripts/run_pipeline.py $ARGS

      - name: Commit site + shared data
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/line_history.json data/calibration.json docs/
          if git diff --staged --quiet; then
            echo "No NFL ledger/site changes"
          else
            git commit -m "chore: update NFL ledger and GitHub Pages site"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
