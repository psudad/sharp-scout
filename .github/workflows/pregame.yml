name: Pregame Windows (T-12 / T-3 / T-1)

# Checks every 30 minutes which games fall inside the 12h / 3h / 1h windows
# (±25 min), then runs side + player-prop pipelines for those games only.
# Secrets: ODDS_API_KEY (required), ACTION_NETWORK_COOKIE (optional),
#          INACTIVE_PLAYERS (optional comma-separated names)

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo mode"
        type: boolean
        default: false
      force_all:
        description: "Force all upcoming games (ignore windows)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pregame
  cancel-in-progress: false

jobs:
  pregame:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "INACTIVE_PLAYERS=${{ secrets.INACTIVE_PLAYERS }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=4000" >> $GITHUB_ENV

      - name: Settle prior plays
        continue-on-error: true
        run: python scripts/settle_plays.py

      - name: Run due pregame windows
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || false }}
        run: |
          # Scheduled cron must not fall back to demo — that re-runs mock KC@BUF every 30 min.
          if [ -z "$ODDS_API_KEY" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No ODDS_API_KEY secret — skipping scheduled pregame (add secret or run workflow manually with demo)."
            exit 0
          fi
          ARGS=""
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="--demo --skip-pbp"
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            ARGS="$ARGS --force-all"
          fi
          python scripts/run_pregame.py $ARGS

      - name: Commit ledger, schedule state, site
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/schedule_state.json docs/ || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: pregame window update (sides + props)"
            git push
          fi

      # Pages deploy is handled by workflows/pages.yml on push to docs/ (avoids 404 when Pages
      # source is not configured for GitHub Actions).
