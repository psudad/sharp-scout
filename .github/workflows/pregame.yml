name: Pregame Windows (T-12 / T-4..T-1)

# Uses data/pregame_run_plan.json (NFL schedule + NCAAF Odds API board) to fire only
# near real kickoff windows — not every 30 minutes.
#
# Scheduled Odds API usage gated by scripts/check_odds_credit_pause.py (includes optional pause
# exceptions such as Nov 1 NFL-only cron 0 14 * * 0 when a billing pause is active).
#
# Secrets (repo Settings → Secrets and variables → Actions → Repository secrets):
#   ODDS_API_KEY (required for live runs)
#   ACTION_NETWORK_COOKIE (optional)
#   INACTIVE_PLAYERS (optional)

on:
  schedule:
    # Refresh run plan daily (~6:07 AM ET) so mid-week NCAAF slates (Tue/Wed) are included
    - cron: "7 10 * * *"
    # Off-minute hours — gate skips hours with no planned games
    - cron: "7,23,41 * * * *"
    # Credit-pause exception: Nov 1 2026 NFL Sunday ~9:07 AM ET (14:07 UTC EST); late-tolerant gate
    - cron: "7 14 * * 0"
  workflow_dispatch:
    inputs:
      demo:
        description: "Demo mode"
        type: boolean
        default: false
      force_all:
        description: "Force all upcoming games (ignore windows)"
        type: boolean
        default: false
      refresh_plan:
        description: "Rebuild pregame_run_plan.json before running"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-scout-main-commits
  cancel-in-progress: false

jobs:
  pregame:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish_flag.outputs.publish }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate — odds credit pause (scheduled)
        id: credit
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 scripts/check_odds_credit_pause.py --workflow pregame

      - name: Gate — skip hour if not in run plan
        id: gate
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only != 'true' &&
          github.event_name == 'schedule' &&
          github.event.schedule != '7 10 * * *' &&
          github.event.schedule != '7 14 * * 0'
        run: python3 scripts/check_pregame_plan.py

      - name: Stop — not a planned run hour
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only != 'true' &&
          github.event_name == 'schedule' &&
          github.event.schedule != '7 10 * * *' &&
          github.event.schedule != '7 14 * * 0' &&
          steps.gate.outputs.run != 'true'
        run: echo "Skipping — no pregame window scheduled for this hour."

      - uses: actions/setup-python@v5
        if: steps.credit.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.credit.outputs.proceed == 'true'
        run: pip install -e .

      - name: Configure env
        if: steps.credit.outputs.proceed == 'true'
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "INACTIVE_PLAYERS=${{ secrets.INACTIVE_PLAYERS }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=4000" >> $GITHUB_ENV

      - name: Build weekly pregame run plan
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only != 'true' &&
          (github.event.schedule == '7 10 * * *' ||
          (github.event_name == 'workflow_dispatch' && inputs.refresh_plan))
        run: python scripts/plan_pregame_runs.py

      - name: Commit run plan
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only != 'true' &&
          (github.event.schedule == '7 10 * * *' ||
          (github.event_name == 'workflow_dispatch' && inputs.refresh_plan))
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_push_retry.sh
          export ADD_PATHS="data/pregame_run_plan.json"
          ./scripts/ci_git_push_retry.sh "chore: refresh pregame run plan (NFL + NCAAF)" python scripts/plan_pregame_runs.py

      - name: Run due pregame windows
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only != 'true' &&
          (github.event_name == 'workflow_dispatch' || steps.gate.outputs.run == 'true')
        env:
          DEMO_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
          FORCE_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all || false }}
        run: |
          if [ -z "$ODDS_API_KEY" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "No ODDS_API_KEY secret — skipping scheduled pregame."
            echo "Add ODDS_API_KEY at: Settings → Secrets and variables → Actions → Repository secrets"
            exit 0
          fi
          ARGS=""
          if [ "$DEMO_INPUT" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="--demo --skip-pbp"
          fi
          if [ "$FORCE_INPUT" = "true" ]; then
            ARGS="$ARGS --force-all"
          fi
          python scripts/run_pregame.py $ARGS --ledger

      - name: Run Nov 1 2026 NFL Sunday pregame (credit pause exception)
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          steps.credit.outputs.nov1_nfl_only == 'true'
        run: |
          if [ -z "$ODDS_API_KEY" ]; then
            echo "No ODDS_API_KEY — skipping Nov 1 NFL scan"
            exit 0
          fi
          python scripts/run_pregame.py --ledger --nfl-only --no-props

      - name: Settle finished games (NFL + NCAAF) and rebuild site
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          (steps.credit.outputs.nov1_nfl_only == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          steps.gate.outputs.run == 'true')
        run: python scripts/settle_now.py

      - name: Commit schedule state + site
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          (steps.credit.outputs.nov1_nfl_only == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          steps.gate.outputs.run == 'true')
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          chmod +x scripts/ci_git_push_retry.sh
          export ADD_PATHS="data/schedule_state.json data/ledger.json data/ncaaf_ledger.json data/props_ledger.json data/line_history.json data/line_history_archive.json data/paper/nfl_totals_momentum_follow.json data/open_lines.json data/calibration.json data/shadow/ reports/ncaaf_totals_high_ev.md docs/"
          if [ "${{ steps.credit.outputs.nov1_nfl_only }}" = "true" ]; then
            PREGAME="python scripts/run_pregame.py --ledger --nfl-only --no-props"
          else
            PREGAME="python scripts/run_pregame.py --ledger"
          fi
          ./scripts/ci_git_push_retry.sh "chore: pregame window update (NFL + NCAAF sides)" bash -c "$PREGAME && python scripts/settle_now.py"

      - name: Upload Pages artifact
        if: >-
          steps.credit.outputs.proceed == 'true' &&
          (steps.credit.outputs.nov1_nfl_only == 'true' ||
          github.event_name == 'workflow_dispatch' ||
          steps.gate.outputs.run == 'true')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: publish_flag
        if: always()
        run: |
          if [ "${{ steps.credit.outputs.proceed }}" = "true" ] && \
             { [ "${{ steps.credit.outputs.nov1_nfl_only }}" = "true" ] || \
               [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
               [ "${{ steps.gate.outputs.run }}" = "true" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: pregame
    if: github.ref == 'refs/heads/main' && needs.pregame.outputs.publish == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
