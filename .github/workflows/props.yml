name: NFL Props (10 AM ET daily)

# Dedicated props run: scores the full slate, locks new props into data/props_ledger.json,
# grades finished props, and rebuilds the NFL Props page. Props are tracked separately
# from the NFL sides card.
#
# Scheduled runs gated by scripts/check_odds_credit_pause.py (workflow_dispatch always runs).

on:
  schedule:
    # 10:00 AM ET (EDT = UTC-4) on NFL game days: Thu, Sat, Sun, Mon, plus Tue to grade MNF
    - cron: "0 14 * * 0,1,2,4,6"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-scout-main-commits
  cancel-in-progress: false

jobs:
  props:
    runs-on: ubuntu-latest
    outputs:
      ran: ${{ steps.credit.outputs.proceed }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate — odds credit pause (scheduled)
        id: credit
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 scripts/check_odds_credit_pause.py --workflow props

      - uses: actions/setup-python@v5
        if: steps.credit.outputs.proceed == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.credit.outputs.proceed == 'true'
        run: pip install -e .

      - name: Configure env
        if: steps.credit.outputs.proceed == 'true'
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "INACTIVE_PLAYERS=${{ secrets.INACTIVE_PLAYERS }}" >> $GITHUB_ENV

      - name: Run props pipeline
        if: steps.credit.outputs.proceed == 'true'
        run: python scripts/run_props.py

      - name: Settle finished games and rebuild site
        if: steps.credit.outputs.proceed == 'true'
        run: python scripts/settle_now.py --sport nfl

      - name: Commit props ledger + site
        if: steps.credit.outputs.proceed == 'true'
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/props_ledger.json docs/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            chmod +x scripts/ci_git_push_retry.sh
            export ADD_PATHS="data/ledger.json data/props_ledger.json docs/"
            ./scripts/ci_git_push_retry.sh "chore: props run + settle + site rebuild" bash -c "python scripts/run_props.py && python scripts/settle_now.py --sport nfl"
          fi

      - name: Upload Pages artifact
        if: steps.credit.outputs.proceed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: props
    if: github.ref == 'refs/heads/main' && needs.props.outputs.ran == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
