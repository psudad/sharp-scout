name: Refresh Board (on demand)

# Manual refresh: scan live markets, post CFB plays, rebuild GitHub Pages.
# Use this any time you want the board updated outside the cron schedule.

on:
  workflow_dispatch:
    inputs:
      nfl:
        description: "Refresh NFL plays + ledger"
        type: boolean
        default: true
      ncaaf:
        description: "Refresh CFB plays + ledger"
        type: boolean
        default: true
      demo:
        description: "Run in demo mode (no API keys)"
        type: boolean
        default: false
      skip_pbp:
        description: "Skip nflverse / cfbfastR PBP download"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Configure env
        run: |
          echo "ODDS_API_KEY=${{ secrets.ODDS_API_KEY }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_TOKEN=${{ secrets.ACTION_NETWORK_TOKEN }}" >> $GITHUB_ENV
          echo "ACTION_NETWORK_COOKIE=${{ secrets.ACTION_NETWORK_COOKIE }}" >> $GITHUB_ENV
          echo "MONTE_CARLO_SIMS=5000" >> $GITHUB_ENV
          echo "GA_MEASUREMENT_ID=${{ secrets.GA_MEASUREMENT_ID }}" >> $GITHUB_ENV

      - name: Settle graded games
        continue-on-error: true
        run: |
          if [ "${{ inputs.ncaaf }}" = "true" ]; then
            python scripts/settle_plays.py --sport ncaaf
          fi
          if [ "${{ inputs.nfl }}" = "true" ]; then
            python scripts/settle_plays.py
          fi

      - name: Refresh NFL signals
        if: inputs.nfl
        run: |
          ARGS="--build-site"
          if [ "${{ inputs.demo }}" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
          elif [ "${{ inputs.skip_pbp }}" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          python scripts/run_pipeline.py $ARGS

      - name: Refresh NCAAF pipeline
        if: inputs.ncaaf
        run: |
          ARGS="--build-site"
          if [ "${{ inputs.demo }}" = "true" ] || [ -z "$ODDS_API_KEY" ]; then
            ARGS="$ARGS --demo --skip-pbp"
          elif [ "${{ inputs.skip_pbp }}" = "true" ]; then
            ARGS="$ARGS --skip-pbp"
          fi
          python scripts/run_ncaaf.py $ARGS

      - name: Rebuild site
        if: inputs.nfl && !inputs.ncaaf
        run: python scripts/build_site.py

      - name: Commit site + ledgers
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ncaaf_ledger.json data/ledger.json data/line_history.json data/calibration.json docs/
          if git diff --staged --quiet; then
            echo "No board changes to commit"
          else
            git commit -m "chore: refresh board from live market"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
