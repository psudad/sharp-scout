name: Settle + Publish (automatic)

# Grades finished NFL/NCAAF games from public scores, rebuilds docs/, commits, and
# deploys GitHub Pages — no Odds API key required. Runs between full pipeline
# crons so records and W-L update soon after games go final.

on:
  schedule:
    # Every 3 hours, all week
    - cron: "15 */3 * * *"
    # Extra passes on typical result windows (UTC)
    - cron: "0 6 * * 1"   # Mon ~2 AM ET — SNF / late NFL
    - cron: "0 12 * * 0"  # Sun ~8 AM ET — Saturday CFB night
    - cron: "0 5 * * 1"   # Mon ~1 AM ET — Sunday NFL bulk
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: settle-publish
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Settle NFL + NCAAF and rebuild site
        run: python scripts/settle_now.py

      - name: Commit ledger + site
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/ncaaf_ledger.json docs/
          if git diff --staged --quiet; then
            echo "No settlement/site changes"
          else
            git commit -m "chore: automatic settlement + site rebuild"
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
