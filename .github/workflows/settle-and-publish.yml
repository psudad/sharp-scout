name: Settle + Publish (automatic)

# Grades finished NFL/NCAAF games from public scores, rebuilds docs/, commits, and
# deploys GitHub Pages — no Odds API key required. Runs between full pipeline
# crons so records and W-L update soon after games go final.

on:
  schedule:
    # Every 3 hours (off the hour), all week
    - cron: "17 */3 * * *"
    - cron: "47 */3 * * *"
    # Extra passes on typical result windows (UTC)
    - cron: "7 6 * * 1"   # Mon ~2:07 AM ET — SNF / late NFL
    - cron: "7 12 * * 0"  # Sun ~8:07 AM ET — Saturday CFB night
    - cron: "7 5 * * 1"   # Mon ~1:07 AM ET — Sunday NFL bulk
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sharp-scout-main-commits
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e .

      - name: Settle NFL + NCAAF and rebuild site
        run: python scripts/settle_now.py

      - name: Settle NBA pace paper + official ledger
        continue-on-error: true
        run: python scripts/settle_nba.py --build-page

      - name: Commit ledger + site
        run: |
          git config user.name "sharp-scout-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ledger.json data/props_ledger.json data/ncaaf_ledger.json data/shadow/ data/paper/nba_score_model.json data/paper/nba_pace_of_play_official.json data/paper/nba_pace_of_play_official.csv data/paper/nba_totals_current_season_shadow.json data/paper/nba_totals_current_season_shadow.csv reports/ncaaf_totals_high_ev.md docs/
          if git diff --staged --quiet; then
            echo "No settlement/site changes"
          else
            chmod +x scripts/ci_git_push_retry.sh
            export ADD_PATHS="data/ledger.json data/props_ledger.json data/ncaaf_ledger.json data/shadow/ data/paper/nba_score_model.json data/paper/nba_pace_of_play_official.json data/paper/nba_pace_of_play_official.csv data/paper/nba_totals_current_season_shadow.json data/paper/nba_totals_current_season_shadow.csv reports/ncaaf_totals_high_ev.md docs/"
            ./scripts/ci_git_push_retry.sh "chore: automatic settlement + site rebuild" python scripts/settle_now.py
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: run
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
