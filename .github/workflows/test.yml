name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Pytest
        run: pytest -q

      # Informational only: records HTTP status from GitHub-hosted runners (may still 403 on IP).
      - name: Barttorvik whitelist probe (one live request on PRs)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          TORVIK_WHITELIST_PROBE: "1"
        run: pytest -q tests/test_torvik_http.py::test_torvik_whitelist_live_probe_from_ci -r a
