[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharp-scout"
version = "0.1.0"
description = "Institutional-grade NFL betting signal pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "scipy>=1.13.0",
  "scikit-learn>=1.5.0",
  "pyarrow>=16.0.0",
  "sqlalchemy>=2.0.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "python-dotenv>=1.0.0",
  "tenacity>=9.0.0",
  "apscheduler>=3.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]
# Optional: richer matchup engine + nflverse scheme enrichment.
# The engine already works on scikit-learn (a core dep); these are upgrades.
ml = ["lightgbm>=4.5.0", "nflreadpy>=0.1.0"]

[project.scripts]
sharp-scout = "sharp_scout.api.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]